# Closing the Loop with Open Source — demo stack
#
#   agent ──OTLP/HTTP──▶ otel-collector ──kafka (otlp_json)──▶ kafka:otlp_spans
#                                                               │
#   agent ◀──streaming query── proton ◀──external stream────────┘
#     │                          │
#     └──HTTP ingest (session log)┘──▶ kafka:agent_actions (for anyone else)
#
#   docker compose up -d                          # proton, kafka, collector, schema
#   docker compose run --rm agent --scenario loop # run an agent
#
# Everything here is open source and runs with no outbound network once the
# images are pulled.

name: osacon-closing-the-loop

services:
  proton:
    image: d.timeplus.com/timeplus-io/proton:latest   # tested with Proton v3.0.31
    ports:
      - "8463:8463"   # native protocol (proton client, proton-driver)
      - "3218:3218"   # HTTP: ingest API + streaming queries
      - "8123:8123"   # HTTP: batch queries
    healthcheck:
      test: ["CMD", "proton", "client", "-q", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "19092:19092"   # from the host: localhost:19092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  # Topics must exist before Proton's Kafka external streams are created.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in otlp_spans agent_actions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1
        done
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Applies sql/*.sql (idempotent: everything is CREATE ... IF NOT EXISTS).
  proton-init:
    image: d.timeplus.com/timeplus-io/proton:latest
    depends_on:
      proton:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for f in /sql/0*.sql; do
          echo "applying $$f"
          proton client --host proton --multiquery < "$$f"
        done
        echo "schema ready"
    restart: "no"

  # Run on demand:  docker compose run --rm agent --scenario loop
  agent:
    build: ./agent
    profiles: ["agent"]
    environment:
      TELEMETRY_MODE: collector
      PROTON_HOST: proton
      PROTON_PORT: "8463"
      PROTON_HTTP: http://proton:3218
      OTLP_ENDPOINT: http://otel-collector:4318
      FORCE_COLOR: "1"
    depends_on:
      proton-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
